name: Build Apps Script Touch WebView-only APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: AppsScriptTouch-WebViewOnly-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v3.0.0-debug.${{ github.run_number }}"
          gh release create "$TAG" "app/build/outputs/apk/debug/app-debug.apk#AppsScriptTouch-WebViewOnly-v3.0.0-debug.apk" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Apps Script Touch WebView Only $TAG" \
            --notes "Direct Google Apps Script webpage in Android WebView; no Google API/OAuth/bridge. Google may restrict embedded sign-in or editing; use Chrome button as fallback. Debug build only." \
            --prerelease
