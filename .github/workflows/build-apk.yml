name: Build Apps Script Touch GeckoView debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: AppsScriptTouch-GeckoView-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v4.2.0-gecko-debug.${{ github.run_number }}"
          gh release create "$TAG" "app/build/outputs/apk/debug/app-debug.apk#AppsScriptTouch-GeckoView-v4.2-debug.apk" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Apps Script Touch GeckoView $TAG" \
            --notes "Firefox GeckoView browser engine inside Android app. Accepts Google Sheets URLs, Apps Script URLs and standard HTTPS sites. No Google Apps Script API or OAuth client. Google login and Apps Script editing NOT YET verified on device. Google may block embedded login; fallback opens Firefox or external browser." \
            --prerelease
